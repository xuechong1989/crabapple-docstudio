# ============================================================
# Crabapple DocStudio 运行时路径配置
# 所有路径均相对于项目根目录；部署到服务器时可改为绝对路径。
# 支持 ${VAR} 引用前面已定义的变量。
# ============================================================

DOCSTUDIO_BASE_DIR=./data
DOCSTUDIO_DATA_DIR=./data
DOCSTUDIO_BASE_DIR_WIN=./data
DOCSTUDIO_TMP_DIR_WIN=./data/tmp
DOCSTUDIO_DIST_DIR=./dist
DOCSTUDIO_TMP_DIR=./data/tmp

# 依赖与虚拟环境（bin/start.sh 使用）
DOCSTUDIO_DEPS_DIR=./dependence
DOCSTUDIO_VENV_DIR=./.venv
DOCSTUDIO_PYTHON=

# 缓存目录
HF_HOME=./data/cache/huggingface
CUDA_CACHE_PATH=./data/cache/cuda
CUDA_CACHE_MAXSIZE=2147483648
TMPDIR=./data/tmp
TORCH_HOME=./data/cache/torch
MPLCONFIGDIR=./data/cache/matplotlib
ULTRALYTICS_CONFIG_DIR=./data/cache/ultralytics

# 旧版兼容登录口令哈希（python scripts/hash_password.py 生成；留空则禁用旧版登录）
DOCSTUDIO_MONGODB_KEY=
DOCSTUDIO_AUTH_HASH=

# CORS：多个地址用逗号分隔；留空仅允许本机访问
DOCSTUDIO_CORS_ORIGINS=

# 可选：form-in 文件库推送与云盘存储（默认关闭）
FORM_IN_ENABLED=false
FORM_IN_ADDRESS=
FORM_IN_USERNAME=
FORM_IN_PASSWORD=
STORE_MODE=localdisk
MONGO_HOST=
MONGO_DBNAME=
MONGO_USERNAME=
MONGO_PASSWORD=
LOCAL_DISK_DIR=./data/bddata
