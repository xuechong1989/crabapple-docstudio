version: 2
updates:
  - package-ecosystem: pip
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    open-pull-requests-limit: 0
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: monthly
