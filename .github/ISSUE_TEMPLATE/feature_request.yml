name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先搜索已有 Issue，避免重复。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能想解决什么场景下的什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望它如何工作？有替代方案也可以写。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 参考
    validations:
      required: false
